name: OTA

# on:
#   release:
#     types: [edited, published]

on:
  repository_dispatch:
    types: [new_release]

defaults:
  run:
    shell: bash

jobs:

  update:
    name: Update OTA release
    runs-on: ubuntu-latest
    steps:
      - run: jq --color-output . <<<'${{ toJSON(github.event) }}'
