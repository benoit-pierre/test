name: Tag

permissions:
  contents: read

on:
  push:
    tags: 
      - v[0-9]*
      - nightly

jobs:

  build:
    name: Build
    uses: ./.github/workflows/_build.yml
    with:
      jobs: release

  release:
    name: Release
    needs: build
    uses: ./.github/workflows/_release.yml
    secrets:
      # Yep, this is required to allow using the `release` environment
      # secret of the same name in the called workflow… Pretty evident,
      # right? ¯\_(ツ)_/¯
      TOKEN: ${{ secrets.TOKEN }}
    with:
      repo: ${{ vars.REPO }}
