name: Nightly

permissions:
  contents: write

on:
  schedule:
    # Every day at 6 AM (UTC, default branch only).
    - cron: '0 6 * * *'
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  
  update:
    name: Update
    runs-on: ubuntu-latest
    if: vars.ORIGIN_GH_REPO
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          clean: false
          fetch-depth: 0
          fetch-tags: true
          filter: tree:0
          show-progress: false
          sparse-checkout:
      - name: Update fork
        run: |
          set -x
          git pull --ff-only ${{ vars.ORIGIN_GH_REPO }} ${{ github.ref }}
          git push --follow-tags origin

  build:
    name: Build
    needs: update
    uses: ./.github/workflows/_build.yml
    with:
      jobs: release

  release:
    name: Release
    needs: build
    uses: ./.github/workflows/_release.yml
    secrets:
      # Yep, this is required to allow using the `release` environment
      # secret of the same name in the called workflow… Pretty evident,
      # right? ¯\_(ツ)_/¯
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    with:
      gh_repo: ${{ vars.RELEASE_GH_REPO || github.repository }}
