# This workflow is managed by gh actions-lock.

name: Lint

permissions:
  contents: read

on:
  workflow_call:
  workflow_dispatch:

defaults:
  run:
    shell: stdbuf --error=L --output=L bash --noprofile --norc -eo pipefail {0}

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      CLICOLOR_FORCE: '1'
    steps:
      - name: Lint
        run: ":"
